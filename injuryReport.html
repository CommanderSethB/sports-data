<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Data</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 40px;
        }
        table {
            width: 90%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 14px;
            text-align: left;
        }
        th {
            background-color: #f9f9f9;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #fcfcfc;
        }
    </style>
</head>
<body>    
    <table id="data-table">
        <thead>
            <tr>
                <!-- Update these headers to match your object keys -->
                <th>Team ID</th>
                <th>Player ID</th>
                <th>Player Name</th>
                <th>Injury Status</th>
                <th>Injury Score</th>
            </tr>
        </thead>
        <tbody>
            <!-- JavaScript will insert rows here -->
        </tbody>
    </table>

    <!-- Link your JavaScript file -->
    <script src="injuryReport.js"></script>
</body>
</html>
